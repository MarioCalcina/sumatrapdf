name: mac-app

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the dmg as a GitHub release (the app's update check reads it)
        type: boolean
        default: true
permissions:
  contents: write

jobs:
  build:
    # macos-latest is Apple Silicon; the app is universal (arm64 + x86_64)
    runs-on: macos-latest
    env:
      # a Developer ID certificate in the secrets: the app is signed and
      # notarized (.github/scripts/sign-mac.sh lists the secrets)
      SIGNED: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # from apptranslator's public history; read only
      - name: Translations
        run: bun cmd/trans-dl.ts
      # a further build of the day is yy.mm.dd.n, n counting that day's releases
      - name: Release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(date +%y.%m.%d)
          n=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq "[.[] | select(.tagName | startswith(\"v$day\"))] | length")
          rev=""
          if [ "$n" -gt 0 ] && [ "$n" -le 9 ]; then rev="-rev $n"; fi
          .github/scripts/run.sh bun cmd/ng-build.ts -rel -universal $rev SumatraPDF
          lipo -archs out/mac/rel-universal/SumatraPDF
      # without the secrets the app keeps its ad-hoc signature, and macOS
      # wants "Open Anyway" the first time
      - name: Sign and notarize
        if: env.SIGNED == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          .github/scripts/sign-mac.sh out/mac/rel-universal/SumatraPDF.app sign
          .github/scripts/sign-mac.sh out/mac/rel-universal/SumatraPDF.app notarize
      # drag-to-Applications disk image; ditto keeps the signature.
      # hdiutil on hosted runners sometimes fails with "Resource busy", so retry
      - name: Package dmg
        run: |
          mkdir dmg
          ditto out/mac/rel-universal/SumatraPDF.app dmg/SumatraPDF.app
          ln -s /Applications dmg/Applications
          for i in 1 2 3; do
            hdiutil create -volname SumatraPDF -srcfolder dmg -format UDZO -ov SumatraPDF-mac.dmg && break
            sleep 10
          done
          test -f SumatraPDF-mac.dmg
      - name: Sign dmg
        if: env.SIGNED == 'true'
        run: .github/scripts/sign-mac.sh out/mac/rel-universal/SumatraPDF.app sign-dmg SumatraPDF-mac.dmg
      # what the dmg is made of, to see what grows it
      - name: Sizes
        run: |
          ls -l SumatraPDF-mac.dmg
          app=out/mac/rel-universal/SumatraPDF.app/Contents
          du -sk $app/MacOS/* $app/Frameworks/* $app/PlugIns/* $app/Resources
          for bin in $app/MacOS/SumatraPDF $app/Frameworks/SumatraQL; do
            for arch in arm64 x86_64; do
              echo "$bin $arch"
              size -m -arch $arch $bin | grep -E "^Segment|section __(text|const|cstring|data|embedded)" | head -20
            done
          done
          ls -l out/mac/rel/embedded.lzsa
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SumatraPDF-mac
          path: SumatraPDF-mac.dmg
          if-no-files-found: error
          retention-days: 7
      # the release page is a download without a GitHub login, and its
      # update-check-mac.txt is what the app's update check reads: the app
      # downloads Dmg, checks Sha256 and installs it over itself
      - name: Release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" out/mac/rel-universal/SumatraPDF.app/Contents/Info.plist)
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/v$ver"
          dmg="https://github.com/$GITHUB_REPOSITORY/releases/download/v$ver/SumatraPDF-mac.dmg"
          sha=$(shasum -a 256 SumatraPDF-mac.dmg | cut -d ' ' -f 1)
          printf '[SumatraPDF]\nLatest: %s\nBuiltOn: %s\nDownloadPage: %s\nDmg: %s\nSha256: %s\n' \
            "$ver" "$(date +%Y-%m-%d)" "$url" "$dmg" "$sha" > update-check-mac.txt
          cat update-check-mac.txt
          if [ "$SIGNED" = true ]; then
            open_en="Apple has notarized the app."
            open_es="Apple ha notarizado la app."
          else
            open_en="Apple has not notarized the app, so the first time macOS won't open it: try to open it once, then in System Settings > Privacy & Security click **Open Anyway**."
            open_es="Apple no ha notarizado la app, así que la primera vez macOS no la abre: intenta abrirla una vez y luego, en Ajustes del Sistema > Privacidad y seguridad, pulsa **Abrir igualmente**."
          fi
          cat > notes.md <<EOF
          SumatraPDF for macOS 11 or later, Apple Silicon and Intel. Built from ${GITHUB_SHA::7}.

          **Install:** open SumatraPDF-mac.dmg and drag SumatraPDF to Applications. $open_en Later versions install themselves from Check for Updates.

          **Instalar:** abre SumatraPDF-mac.dmg y arrastra SumatraPDF a Aplicaciones. $open_es Las versiones siguientes se instalan solas desde Buscar actualizaciones.
          EOF
          gh release create "v$ver" SumatraPDF-mac.dmg update-check-mac.txt -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "SumatraPDF $ver" --latest --notes-file notes.md

      # screenshots of the app installed from the dmg; best effort
      - name: Screenshots
        continue-on-error: true
        run: |
          hdiutil attach SumatraPDF-mac.dmg -nobrowse -mountpoint /Volumes/SumatraPDF
          APP=/Volumes/SumatraPDF/SumatraPDF.app
          mkdir shots
          open -n -a "$APP" --args -for-testing
          sleep 10
          screencapture -x shots/home.png
          pkill -f "SumatraPDF -for-testing" || true
          sleep 2
          open -n -a "$APP" "$PWD/ext/a-zlib/zlib.3.pdf" --args -for-testing
          sleep 10
          screencapture -x shots/document.png
          pkill -f "SumatraPDF -for-testing" || true
          sleep 2
          # with macOS in Spanish the app starts in Spanish
          defaults write -g AppleLanguages -array es
          open -n -a "$APP" --args -for-testing
          sleep 10
          screencapture -x shots/home-es.png
          pkill -f "SumatraPDF -for-testing" || true
          defaults delete -g AppleLanguages
          hdiutil detach /Volumes/SumatraPDF
      # with macOS in Spanish: the main menu as text and the windows most used,
      # AppKit's print and open panels among them, to spot untranslated text
      - name: Spanish screenshots
        continue-on-error: true
        timeout-minutes: 10
        run: |
          hdiutil attach SumatraPDF-mac.dmg -nobrowse -mountpoint /Volumes/SumatraPDF
          APP=/Volumes/SumatraPDF/SumatraPDF.app
          # runs a command for at most $1 seconds: a reply that never comes once held the job 90 minutes
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          defaults write -g AppleLanguages -array es
          # Save As with ⌘S: without -dbg-control it is macOS's save panel, whose
          # name field takes ⌘V through the Edit menu. Menu bar item 3 is File, 4 Edit.
          # Runs before printing: the print panel's local network prompt stays up
          open -n -a "$APP" "$PWD/ext/a-zlib/zlib.3.pdf" --args -for-testing
          sleep 8
          for m in 3 4; do
            t 20 osascript -e "tell application \"System Events\" to tell process \"SumatraPDF\" to get name of every menu item of menu 1 of menu bar item $m of menu bar 1" \
              > shots/es-menubar-$m.txt 2>&1 || echo "menu $m: exit $?"
          done
          # File > Abrir con (Open With) and Compartir (Share), opened as a user would
          for sub in "Abrir con" Compartir; do
            f=shots/es-$(echo "$sub" | tr -d ' ').txt
            t 30 osascript -e 'on run argv' -e 'tell application "System Events" to tell process "SumatraPDF"' \
              -e 'set frontmost to true' -e 'click menu bar item 3 of menu bar 1' -e 'delay 1' \
              -e 'click menu item (item 1 of argv) of menu 1 of menu bar item 3 of menu bar 1' -e 'delay 2' \
              -e 'get name of every menu item of menu 1 of menu item (item 1 of argv) of menu 1 of menu bar item 3 of menu bar 1' \
              -e 'end tell' -e 'end run' "$sub" > "$f" 2>&1 || echo "$sub: exit $?"
            screencapture -x "${f%.txt}.png"
            t 10 osascript -e 'tell application "System Events" to key code 53' -e 'delay 0.5' \
              -e 'tell application "System Events" to key code 53' || true
            sleep 1
          done
          printf 'pegado-con-cmd-v' | pbcopy
          # after ⌘V the name field has the focus
          t 60 osascript -e 'tell application "System Events" to tell process "SumatraPDF"' \
            -e 'set frontmost to true' -e 'keystroke "s" using command down' -e 'delay 3' \
            -e 'keystroke "a" using command down' -e 'keystroke "v" using command down' -e 'delay 1' \
            -e 'get value of (value of attribute "AXFocusedUIElement")' \
            -e 'end tell' > shots/es-save-paste.txt 2>&1 || echo "keystroke: exit $?"
          sleep 2
          screencapture -x shots/es-save.png
          pkill -f "SumatraPDF -for-testing" || true
          sleep 2
          for c in CmdCommandPalette CmdToggleKeyboardHelp CmdOptions CmdAdvancedSettings CmdChangeTheme \
            CmdChangeLanguage CmdProperties CmdHelpAbout CmdGoToPage CmdFindFirst CmdPrint CmdOpenFile; do
            open -n -a "$APP" "$PWD/ext/a-zlib/zlib.3.pdf" --args -for-testing -dbg-control "es-$c" \
              -log-to-file "$PWD/shots/es-$c.log"
            sleep 8
            if [ $c = CmdCommandPalette ]; then
              t 20 bun cmd/ng-dbg-control.ts -pipe "es-$c" -- TestMainMenu > shots/es-menu.txt 2>&1 \
                || echo "TestMainMenu: exit $?"
              t 20 osascript -e 'tell application "System Events" to tell process "SumatraPDF" to get name of every menu item of menu 1 of menu bar item 2 of menu bar 1' > shots/es-appmenu.txt 2>&1 \
                || echo "osascript: exit $?"
            fi
            # a modal panel holds the reply back, so don't wait for it
            t 20 bun cmd/ng-dbg-control.ts -pipe "es-$c" -- TestInvokeCommand $c > /dev/null 2>&1 &
            sleep 4
            screencapture -x shots/es-$c.png
            pkill -f "SumatraPDF -for-testing" || true
            sleep 2
          done
          cp -R "$HOME/Library/Application Support/SumatraPDF/crashinfo" shots/ || true
          defaults delete -g AppleLanguages || true
          hdiutil detach /Volumes/SumatraPDF || true
      # a LaTeX editor's forward search: a second SumatraPDF hands it to the one
      # running (not -for-testing, which always starts its own) and quits. A
      # .pdfsync maps line 5 of zlib.3.tex to the top of page 1
      - name: Reuse instance
        continue-on-error: true
        timeout-minutes: 5
        run: |
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          APP="$PWD/out/mac/rel-universal/SumatraPDF.app"
          mkdir -p fs shots
          cp ext/a-zlib/zlib.3.pdf fs/
          : > fs/zlib.3.tex
          printf 'zlib.3\nversion 1\nl 1 5\ns 1\np 1 4000000 46000000\n' > fs/zlib.3.pdfsync
          open -n -a "$APP" --args -log-to-file "$PWD/shots/reuse-server.log"
          sleep 8
          t 20 "$APP/Contents/MacOS/SumatraPDF" -reuse-instance -forward-search "$PWD/fs/zlib.3.tex" 5 \
            "$PWD/fs/zlib.3.pdf" -log-to-file "$PWD/shots/reuse-client.log"
          echo "client exit $?" > shots/reuse.txt
          sleep 4
          pgrep -fl "SumatraPDF.app/Contents/MacOS/SumatraPDF" >> shots/reuse.txt || true
          screencapture -x shots/reuse.png
          grep -h "InstanceCmds\|ForwardSearch\|SendToRunningInstance" shots/reuse-*.log >> shots/reuse.txt || true
          pkill -f "SumatraPDF.app/Contents/MacOS/SumatraPDF" || true
          sleep 2
      # Finder's thumbnails and Quick Look's previews from the app's extensions,
      # for files macOS can't show itself
      - name: Quick Look
        continue-on-error: true
        timeout-minutes: 10
        run: |
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          mkdir -p shots/ql ~/Desktop/qltest
          ditto out/mac/rel-universal/SumatraPDF.app /Applications/SumatraPDF.app
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister \
            -f -R /Applications/SumatraPDF.app
          for e in Thumbnails Preview; do
            pluginkit -a /Applications/SumatraPDF.app/Contents/PlugIns/Sumatra$e.appex || true
          done
          sleep 3
          for e in Thumbnails Preview; do
            pluginkit -m -v -A -i org.sumatrapdfreader.SumatraPDF.$e >> shots/ql/pluginkit.txt 2>&1 || true
          done
          cp docs/test/test.cbz docs/test/test.djvu tests/issue-2254.fb2 tests/issue-4315.azw3 ~/Desktop/qltest/
          # what the bundle carries
          (cd /Applications/SumatraPDF.app && find Contents -type f -size +200k -exec ls -l {} \;) > shots/ql/sizes.txt
          # thumbnails as Finder asks for them; a PDF's (macOS's own) for comparison
          t 300 swift .github/scripts/ql-thumbs.swift shots/ql ~/Desktop/qltest/* docs/test/links.pdf \
            > shots/ql/thumbs.txt 2>&1 || echo "exit $?" >> shots/ql/thumbs.txt
          # the space bar's preview
          for f in test.cbz issue-2254.fb2; do
            t 20 qlmanage -p ~/Desktop/qltest/$f > /dev/null 2>&1 &
            sleep 10
            screencapture -x shots/ql/preview-$f.png
            pkill -f qlmanage || true
            sleep 1
          done
          # Finder's icons, below the local network prompt the print step left up
          open ~/Desktop/qltest
          sleep 3
          t 20 osascript -e 'tell application "Finder" to set current view of front window to icon view' \
            -e 'tell application "Finder" to set icon size of icon view options of front window to 128' \
            -e 'tell application "Finder" to set bounds of front window to {0, 370, 1000, 740}' || true
          sleep 8
          screencapture -x shots/ql/finder.png
          # the extensions' own messages and crashes
          log show --last 10m --style compact \
            --predicate 'process BEGINSWITH "Sumatra" OR eventMessage CONTAINS[c] "sumatra"' \
            2>&1 | tail -300 > shots/ql/log.txt || true
          ls -la ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports > shots/ql/crashes.txt 2>&1 || true
          cp ~/Library/Logs/DiagnosticReports/Sumatra* shots/ql/ 2>/dev/null || true
      # Check for Updates' install, on a dmg already here: the app copies it in,
      # quits, and a script swaps the bundles and starts the new one
      - name: Install an update
        continue-on-error: true
        timeout-minutes: 5
        run: |
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          mkdir -p inst shots
          ditto out/mac/rel-universal/SumatraPDF.app inst/SumatraPDF.app
          cp SumatraPDF-mac.dmg update.dmg
          before=$(stat -f %i inst/SumatraPDF.app)
          open -n -a "$PWD/inst/SumatraPDF.app" --args -for-testing -dbg-control upd \
            -log-to-file "$PWD/shots/update.log"
          sleep 8
          t 20 bun cmd/ng-dbg-control.ts -pipe upd -- TestInstallUpdate "$PWD/update.dmg" > shots/update.txt 2>&1 \
            || echo "TestInstallUpdate: exit $?" >> shots/update.txt
          for i in $(seq 30); do
            sleep 2
            if [ "$(stat -f %i inst/SumatraPDF.app 2>/dev/null)" != "$before" ] \
              && pgrep -f "inst/SumatraPDF.app/Contents/MacOS/SumatraPDF" > /dev/null; then
              break
            fi
          done
          echo "inode before $before after $(stat -f %i inst/SumatraPDF.app 2>/dev/null)" >> shots/update.txt
          ls -la inst >> shots/update.txt
          pgrep -fl "inst/SumatraPDF.app" >> shots/update.txt || echo "not running" >> shots/update.txt
          pkill -f "inst/SumatraPDF.app" || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: SumatraPDF-mac-screenshots
          path: shots/
          if-no-files-found: warn
          retention-days: 7
