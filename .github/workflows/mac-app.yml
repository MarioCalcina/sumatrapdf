name: mac-app

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    # macos-latest is Apple Silicon: the app is arm64 only
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Release build
        run: bun cmd/ng-build.ts -rel SumatraPDF
      # drag-to-Applications disk image; ditto keeps the ad-hoc signature.
      # hdiutil on hosted runners sometimes fails with "Resource busy", so retry
      - name: Package dmg
        run: |
          mkdir dmg
          ditto out/mac/rel/SumatraPDF.app dmg/SumatraPDF.app
          ln -s /Applications dmg/Applications
          for i in 1 2 3; do
            hdiutil create -volname SumatraPDF -srcfolder dmg -format UDZO -ov SumatraPDF-mac.dmg && break
            sleep 10
          done
          test -f SumatraPDF-mac.dmg
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SumatraPDF-mac
          path: SumatraPDF-mac.dmg
          if-no-files-found: error
          retention-days: 7
