name: mac-app

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    # macos-latest is Apple Silicon: the app is arm64 only
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # from apptranslator's public history; read only
      - name: Translations
        run: bun cmd/trans-dl.ts
      - name: Release build
        run: bun cmd/ng-build.ts -rel SumatraPDF
      # drag-to-Applications disk image; ditto keeps the ad-hoc signature.
      # hdiutil on hosted runners sometimes fails with "Resource busy", so retry
      - name: Package dmg
        run: |
          mkdir dmg
          ditto out/mac/rel/SumatraPDF.app dmg/SumatraPDF.app
          ln -s /Applications dmg/Applications
          for i in 1 2 3; do
            hdiutil create -volname SumatraPDF -srcfolder dmg -format UDZO -ov SumatraPDF-mac.dmg && break
            sleep 10
          done
          test -f SumatraPDF-mac.dmg
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SumatraPDF-mac
          path: SumatraPDF-mac.dmg
          if-no-files-found: error
          retention-days: 7

      # screenshots of the app installed from the dmg; best effort
      - name: Screenshots
        continue-on-error: true
        run: |
          hdiutil attach SumatraPDF-mac.dmg -nobrowse -mountpoint /Volumes/SumatraPDF
          APP=/Volumes/SumatraPDF/SumatraPDF.app
          mkdir shots
          open -n -a "$APP" --args -for-testing
          sleep 10
          screencapture -x shots/home.png
          pkill -f "SumatraPDF -for-testing" || true
          sleep 2
          open -n -a "$APP" "$PWD/ext/a-zlib/zlib.3.pdf" --args -for-testing
          sleep 10
          screencapture -x shots/document.png
          pkill -f "SumatraPDF -for-testing" || true
          sleep 2
          # with macOS in Spanish the app starts in Spanish
          defaults write -g AppleLanguages -array es
          open -n -a "$APP" --args -for-testing
          sleep 10
          screencapture -x shots/home-es.png
          pkill -f "SumatraPDF -for-testing" || true
          defaults delete -g AppleLanguages
          hdiutil detach /Volumes/SumatraPDF
      # with macOS in Spanish: the main menu as text and the windows most used,
      # AppKit's print and open panels among them, to spot untranslated text
      - name: Spanish screenshots
        continue-on-error: true
        timeout-minutes: 10
        run: |
          hdiutil attach SumatraPDF-mac.dmg -nobrowse -mountpoint /Volumes/SumatraPDF
          APP=/Volumes/SumatraPDF/SumatraPDF.app
          # runs a command for at most $1 seconds: a reply that never comes once held the job 90 minutes
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          defaults write -g AppleLanguages -array es
          for c in CmdCommandPalette CmdToggleKeyboardHelp CmdOptions CmdAdvancedSettings CmdChangeTheme \
            CmdChangeLanguage CmdProperties CmdHelpAbout CmdGoToPage CmdFindFirst CmdPrint CmdOpenFile; do
            open -n -a "$APP" "$PWD/ext/a-zlib/zlib.3.pdf" --args -for-testing -dbg-control "es-$c" \
              -log-to-file "$PWD/shots/es-$c.log"
            sleep 8
            if [ $c = CmdCommandPalette ]; then
              t 20 bun cmd/ng-dbg-control.ts -pipe "es-$c" -- TestMainMenu > shots/es-menu.txt 2>&1 \
                || echo "TestMainMenu: exit $?"
              t 20 osascript -e 'tell application "System Events" to tell process "SumatraPDF" to get name of every menu item of menu 1 of menu bar item 2 of menu bar 1' > shots/es-appmenu.txt 2>&1 \
                || echo "osascript: exit $?"
            fi
            # a modal panel holds the reply back, so don't wait for it
            t 20 bun cmd/ng-dbg-control.ts -pipe "es-$c" -- TestInvokeCommand $c > /dev/null 2>&1 &
            sleep 4
            screencapture -x shots/es-$c.png
            pkill -f "SumatraPDF -for-testing" || true
            sleep 2
          done
          cp -R "$HOME/Library/Application Support/SumatraPDF/crashinfo" shots/ || true
          defaults delete -g AppleLanguages
          hdiutil detach /Volumes/SumatraPDF || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: SumatraPDF-mac-screenshots
          path: shots/
          if-no-files-found: warn
          retention-days: 7
