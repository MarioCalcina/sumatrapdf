name: mac-format

# For a development PC without bun: runs code generators and the formatters
# (clang-format, prettier) on a Mac and uploads what they changed as
# format.patch (artifact format-patch), to apply with git apply.
on:
  workflow_dispatch:
    inputs:
      gen:
        description: "generator scripts to run first, space separated (cmd/<name>.ts)"
        required: false
        default: "cmd/ng-gen-settings.ts"
permissions:
  contents: read

jobs:
  format:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: clang-format
        run: brew install clang-format && clang-format --version
      - name: Generate
        env:
          GEN: ${{ inputs.gen }}
        run: |
          for s in $GEN; do
            [[ "$s" =~ ^cmd/[a-z0-9-]+\.ts$ ]] || { echo "not a generator: $s"; exit 1; }
            bun "$s"
          done
      - name: Format
        run: bun cmd/ng-format.ts
      - name: Patch
        run: |
          git diff --binary > format.patch
          git diff --stat
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: format-patch
          path: format.patch
          retention-days: 7
