name: mac-deps

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  deps:
    # temporary: lists every repo file the macOS build compiles or includes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Build all targets
        run: |
          bun cmd/ng-build.ts -rel -all
          bun cmd/ng-build.ts -dbg -all
      - name: Unit tests
        continue-on-error: true
        run: bun cmd/ng-build.ts -dbg test_util -run -- -for-ai
      - name: List used files
        run: |
          find out -name '*.d' -print0 | xargs -0 cat | tr ' \\' '\n\n' | grep -v ':$' | sed '/^$/d' | sort -u > deps-raw.txt
          wc -l deps-raw.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mac-deps
          path: deps-raw.txt
          retention-days: 7
