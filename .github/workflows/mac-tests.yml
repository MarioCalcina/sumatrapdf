name: mac-tests

# The integration tests (tests/run-github-ci.ts) against the debug ASan app.
# They take about 40 minutes, so this runs only when started by hand.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: "test names, comma separated; empty runs them all"
        required: false
        default: ""
permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # from apptranslator's public history; read only
      - name: Translations
        run: bun cmd/trans-dl.ts
      - name: Build
        run: |
          (cd tests && bun install)
          .github/scripts/run.sh bun cmd/ng-build.ts -dbg -asan SumatraPDF test_util
      - name: Tests
        env:
          TESTS: ${{ inputs.tests }}
        run: bun tests/run-github-ci.ts $TESTS 2>&1 | tee tests.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: tests-log
          path: tests.log
          retention-days: 7
